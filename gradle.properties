# Perf: increased heap for faster builds with large dependency graph
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
# Perf: parallel project execution
org.gradle.parallel=true
# Perf: daemon keeps JVM warm between builds
org.gradle.daemon=true
# Perf: configuration cache avoids re-evaluating build scripts on unchanged builds (~10-40% faster)
org.gradle.configuration-cache=true
android.useAndroidX=true
# Note: Jetifier still needed for rxbinding-support-v4-kotlin:2.2.0 which uses
# the old Support Library. Can be disabled after migrating to rxbinding 3+.
android.enableJetifier=true
kotlin.code.style=official
# TODO: Perf: set to true after verifying no cross-module R references exist.
# nonTransitiveRClass=true avoids generating duplicate R class entries across modules,
# reducing compilation time and memory. Currently safe since data/domain/common don't use R.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Perf: enable Kotlin incremental compilation and KAPT improvements
kotlin.incremental=true
kapt.incremental.apt=true
kapt.use.worker.api=true
